<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="두 파원에서 P까지의 경로를 비교하며 파동의 간섭을 살펴보세요." />
    <title>파동의 간섭</title>
    <script>
      // This fallback must work even when the application bundle cannot load.
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return;
        function showLoadFailure() {
          var status = document.querySelector('[data-startup-status]');
          if (status) status.textContent = '시뮬레이터를 불러오지 못했어요. 연결을 확인하고 새로고침해 주세요.';
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showLoadFailure, { once: true });
        else showLoadFailure();
      }, true);
    </script>
  </head>
  <body>
    <div id="app">
      <main class="failure-screen">
        <h1>파동의 간섭</h1>
        <p data-startup-status role="status">시뮬레이터를 불러오는 중입니다.</p>
        <a href="">새로고침</a>
        <noscript><p>시뮬레이터를 사용하려면 JavaScript를 켜 주세요.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/app/bootstrap.ts"></script>
  </body>
</html>
